name: ImmortalBossAltar
version: 0.3.0
main: kr.server.immortalbossaltar.ImmortalBossAltarPlugin
api-version: '1.21'
softdepend: [MythicMobs]
author: kkaiel
description: End altar summoning, permanent boss completion tracking, and reward handling.
commands:
  bossaltar:
    description: ImmortalBossAltar administration
    usage: /bossaltar <setcenter|status|reset|reload>
    permission: immortalbossaltar.admin
permissions:
  immortalbossaltar.admin:
    default: op
