# ImmortalBossAltar 0.2.0
# setcenter: stand in the End and look directly at the central pillar's
# top BEDROCK support block, then run /bossaltar setcenter. That bedrock
# coordinate is stored; the dragon egg is placed in the air block above it.
altar:
  world: ''
  center: { x: 0, y: 0, z: 0 }
  pedestal-material: BEDROCK
  pedestal-offset: 2
  # Pedestal blocks are at the same Y as the egg's block position.
  ritual-seconds: 10
  require-bedrock-support: true

boss:
  mythicmobs-internal-name: AncientDoomDragon
  spawn-y-offset: 2.0
  detection-radius: 32.0

reward:
  mythicmobs-item-internal-name: EndDoomScoreSword
  reward-id: ancient_doom_dragon_score

portal:
  scan-radius: 3

