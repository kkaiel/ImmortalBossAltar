plugins {
    id 'java'
}

group = 'kr.server'
version = '0.4.3'

repositories {
    mavenCentral()
    maven { url = 'https://repo.papermc.io/repository/maven-public/' }
}

dependencies {
    // The plugin uses stable Bukkit/Paper APIs available in 1.21.11 and later.
    // Compile against this API baseline; run on the server's Paper 26.3 runtime.
    compileOnly 'io.papermc.paper:paper-api:1.21.11-R0.1-SNAPSHOT'
}

java {
    toolchain { languageVersion = JavaLanguageVersion.of(25) }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 21
}

jar {
    archiveBaseName = 'ImmortalBossAltar'
}
